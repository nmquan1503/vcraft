services:
  backend:
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    environment:
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      APP_BASE_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      PASSWORD_RESET_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}/reset-password
  frontend:
    build:
      context: ./frontend
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vcraft_net
